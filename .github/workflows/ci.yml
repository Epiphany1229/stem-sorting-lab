name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      - name: Sync dependencies (from uv.lock)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy backend tests
      - name: Pytest (offline; external HTTP is mocked)
        run: uv run pytest -q
        env:
          AUTO_SYNC_ENABLED: "false"

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pnpm
        run: npm i -g pnpm@12.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test:run
      - name: Production build
        run: pnpm build
